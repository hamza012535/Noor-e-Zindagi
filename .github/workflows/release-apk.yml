name: Build & Release APK for Komi Store

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update on GitHub Releases"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure & accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Restore signing keystore for Firebase Auth compatibility
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "::warning::debug.keystore.base64 not found; generating fallback debug.keystore (Google Sign-In will need this keystore SHA-1)."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build signed APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Copy APK with clean release filename
        run: cp app/build/outputs/apk/debug/app-debug.apk Noor-e-Zindagi.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-e-Zindagi-apk
          path: Noor-e-Zindagi.apk

      - name: Publish GitHub Release for Komi Store
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: "Noor-e-Zindagi (${{ inputs.release_tag || github.ref_name }})"
          files: Noor-e-Zindagi.apk
